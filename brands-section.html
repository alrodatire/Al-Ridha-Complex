<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>علاماتنا التجارية</title>
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#111}
.brands-section{max-width:1100px;margin:auto;padding:45px 18px;text-align:center}
.brands-section h2{font-size:32px;margin:0 0 10px}
.brands-section p{color:#555;margin:0 0 30px}
.brands-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}
.brand-card{background:#fff;border-radius:16px;padding:18px;min-height:130px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px #0002}
.brand-card img{width:100%;max-width:220px;max-height:100px;object-fit:contain}
@media(max-width:520px){.brands-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section class="brands-section" id="brands">
<h2>علاماتنا التجارية</h2>
<p>مجموعة من العلامات التجارية المتوفرة لدى مجمع بركات الرضا</p>
<div class="brands-grid">
<div class="brand-card"><img src="hilo.png" alt="HILO"></div>
<div class="brand-card"><img src="wanli.png" alt="WANLI"></div>
<div class="brand-card"><img src="comforser.png" alt="Comforser"></div>
<div class="brand-card"><img src="kapsen.png" alt="KAPSEN"></div>
<div class="brand-card"><img src="hifly.png" alt="HIFLY"></div>
</div>
</section>
</body></html>
